# Les sujets que l'oracle suit pour toi. Modifie librement ce fichier :
#   - ajoute ou retire un [[dossier]] ;
#   - « mots » : expressions cherchées dans l'intitulé (anglais) des marchés ;
#   - « mots_fr » : expressions cherchées dans les titres de presse français
#     (les « mots » servent aussi pour les titres en anglais) ;
#   - « gdelt » : la recherche envoyée à GDELT (actualité mondiale), facultative ;
#   - un dossier sans « mots » ne suit que l'actualité (aucun marché n'en parle).
# Les majuscules ne comptent pas, les accents si ; mots entiers ;
# \w* = « et la suite du mot ». À égalité entre deux dossiers, le premier gagne.
# Le mail donne les 5 dossiers de marchés les plus importants, puis les dossiers
# d'actualité seule.

[bruit]
# Marchés jamais retenus, même s'ils touchent un dossier.
mots = [
  "truth social", "tweets?", "posts?", "mentions?",
  "millennium prize", "riemann", "hodge", "navier", "yang[- ]mills", "p vs\\.? np",
  "person of the (year|decade)",
]

[actualite]
# Flux RSS lus à chaque relevé (titres et liens seulement, jamais le texte).
flux = [
  { nom = "franceinfo", url = "https://www.francetvinfo.fr/titres.rss" },
  { nom = "France 24", url = "https://www.france24.com/fr/rss" },
  { nom = "RFI", url = "https://www.rfi.fr/fr/rss" },
  { nom = "Le Monde", url = "https://www.lemonde.fr/rss/une.xml" },
  { nom = "Le Monde International", url = "https://www.lemonde.fr/international/rss_full.xml" },
  { nom = "Le Monde Éducation", url = "https://www.lemonde.fr/education/rss_full.xml" },
  { nom = "franceinfo Éducation", url = "https://www.francetvinfo.fr/societe/education.rss" },
  { nom = "Café pédagogique", url = "https://www.cafepedagogique.net/feed/" },
  { nom = "VousNousIls", url = "https://www.vousnousils.fr/feed" },
  # International, en anglais : la plupart des marchés portent sur les États-Unis et le
  # Moyen-Orient. GDELT (plus large) bloque souvent les requêtes automatiques (429).
  { nom = "BBC World", url = "https://feeds.bbci.co.uk/news/world/rss.xml" },
  { nom = "BBC Business", url = "https://feeds.bbci.co.uk/news/business/rss.xml" },
  { nom = "Al Jazeera", url = "https://www.aljazeera.com/xml/rss/all.xml" },
  { nom = "The Guardian World", url = "https://www.theguardian.com/world/rss" },
  { nom = "The Guardian US", url = "https://www.theguardian.com/us-news/rss" },
]

[[dossier]]
nom = "Iran"
mots = ["iran\\w*", "tehran", "khamenei", "hormuz", "irgc"]
mots_fr = ["iran\\w*", "téhéran", "khamenei", "ormuz"]
gdelt = "(iran OR tehran OR khamenei)"

