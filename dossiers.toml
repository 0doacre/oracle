# Les sujets que l'oracle suit pour toi. Modifie librement ce fichier :
#   - ajoute ou retire un [[dossier]] ;
#   - « mots » : expressions cherchées dans l'intitulé (anglais) des marchés,
#     sans tenir compte des majuscules, en mots entiers. \w* = « et la suite du mot ».
#   - un marché qui touche plusieurs dossiers va à celui qui a le plus de mots
#     trouvés ; à égalité, au premier de la liste.
# Le mail donne les 5 dossiers qui bougent ou se décident le plus.

[bruit]
# Marchés jamais retenus, même s'ils touchent un dossier : paris sur des
# comptages de messages, défis mathématiques, distinctions médiatiques.
mots = [
  "truth social", "tweets?", "posts?", "mentions?",
  "millennium prize", "riemann", "hodge", "navier", "yang[- ]mills", "p vs\\.? np",
  "person of the (year|decade)",
]

[[dossier]]
nom = "Iran"
mots = ["iran\\w*", "tehran", "khamenei", "hormuz", "irgc"]

